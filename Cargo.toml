[workspace]
members = [
    "crates/appcraft-core",
    "crates/appcraft-templates",
    "crates/appcraft-mcp",
    "crates/appcraft-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["sandraschi fleet <sandraschi@example.com>"]
license = "MIT"
repository = "https://github.com/sandraschi/appcraft"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
eframe = "0.37"
egui = "0.37"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
databasecraft-core = { path = "../databasecraft/crates/databasecraft-core" }
databasecraft-store = { path = "../databasecraft/crates/databasecraft-store" }
